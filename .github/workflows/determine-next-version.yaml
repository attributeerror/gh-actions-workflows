name: Determine next version

on:
  workflow_call:
    outputs:
      version: 
        description: 'The version determined via Semantic Release'
        value: ${{ jobs.determine-release-version.outputs.version }}
      git-tag:
        description: 'The Git tag to be published, if applicable.'
        value: v${{ jobs.determine-release-version.outputs.version }}
      release-notes:
        description: 'The release notes generated by Semantic Release, if applicable.'
        value: ${{ jobs.determine-release-version.outputs.release-notes }}
      new-release-published:
        description: 'Whether Semantic Release has determined that a new release should be published.'
        value: ${{ jobs.determine-release-version.outputs.new-release-published || 'false' }}

jobs:
  determine-release-version:
    if: |
      github.triggering_actor != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message || '', '[skip ci]')
    outputs:
      version: ${{ steps.semantic.outputs.release-version }}
      release-notes: ${{ steps.semantic.outputs.release-notes }}
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      # This workflow runs in the calling repository, so fetch the release
      # script (and its default config) from this repository separately.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          repository: attributeerror/gh-actions-workflows
          ref: ${{ github.job_workflow_sha || 'main' }}
          path: .release-tooling
          sparse-checkout: .github/workflows/scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .release-tooling/.github/workflows/scripts/package-lock.json

      - name: Install release tooling dependencies
        working-directory: .release-tooling/.github/workflows/scripts
        run: npm ci --no-audit --no-fund

      # Uses the repository's own semantic-release config if it has one,
      # otherwise creates .releaserc.json from scripts/default.releaserc.json.
      - name: Run Semantic Release
        id: semantic
        run: node .release-tooling/.github/workflows/scripts/run_semantic_release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Release Variables
        env:
          VERSION: ${{ steps.semantic.outputs.release-version }}
          GIT_TAG: v${{ steps.semantic.outputs.release-version }}
          RELEASE_NOTES: ${{ steps.semantic.outputs.release-notes }}
          NEW_RELEASE_PUBLISHED: ${{ steps.semantic.outputs.new-release-published }}
        run: |
          echo -e "Is new release published?: $NEW_RELEASE_PUBLISHED\nVersion: $VERSION\nGit Tag: $GIT_TAG\nRelease notes: $RELEASE_NOTES"